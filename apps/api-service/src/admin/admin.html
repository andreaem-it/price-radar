<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PriceRadar Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a2332;
        --border: #2d3a4d;
        --text: #e7ecf3;
        --muted: #93a4b8;
        --accent: #3b82f6;
        --warn: #f59e0b;
        --danger: #ef4444;
        --ok: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      h1 { margin: 0; font-size: 1.25rem; }
      main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
      }
      .card h2 {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .metric { font-size: 1.75rem; font-weight: 700; }
      .muted { color: var(--muted); font-size: 0.875rem; }
      .badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
      .badge.warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
      .badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      button, input {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 0.6rem 0.9rem;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        border-color: transparent;
        font-weight: 600;
      }
      button.secondary { background: var(--panel); border-color: var(--border); }
      button.danger { background: var(--danger); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th, td {
        text-align: left;
        padding: 0.65rem 0.5rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 600; }
      .status { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
      .status.running { color: var(--accent); }
      .status.queued { color: var(--warn); }
      .status.failed { color: var(--danger); }
      .status.completed { color: var(--ok); }
      #alert {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        display: none;
      }
      #alert.show { display: block; }
      #alert.error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); }
      #alert.success { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35); }
      #token-row { display: flex; gap: 0.5rem; align-items: center; }
      #token-row input { min-width: 220px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>PriceRadar Admin</h1>
        <div class="muted">Monitoraggio coda scraping</div>
      </div>
      <div id="token-row">
        <input id="admin-token" type="password" placeholder="ADMIN_TOKEN (se configurato)" />
        <button class="secondary" id="save-token">Salva token</button>
      </div>
    </header>
    <main>
      <div id="alert"></div>

      <div class="actions">
        <button id="refresh">Aggiorna</button>
        <button class="danger" id="unblock">Sblocca coda</button>
        <span class="muted" id="updated-at"></span>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Stato sistema</h2>
          <div id="health-badges"></div>
        </div>
        <div class="card">
          <h2>Prodotti</h2>
          <div class="metric" id="products-count">—</div>
        </div>
        <div class="card">
          <h2>Redis in coda</h2>
          <div class="metric" id="redis-waiting">—</div>
          <div class="muted">attivi: <span id="redis-active">—</span></div>
        </div>
        <div class="card">
          <h2>Drift SQLite / Redis</h2>
          <div id="drift-status"></div>
        </div>
      </div>

      <div class="grid" id="job-stats"></div>

      <div class="card">
        <h2>Job recenti</h2>
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Prodotto</th>
              <th>ASIN</th>
              <th>Aggiornato</th>
              <th>Errore</th>
            </tr>
          </thead>
          <tbody id="jobs-body"></tbody>
        </table>
      </div>
    </main>

    <script>
      const TOKEN_KEY = 'priceradar_admin_token';

      function getToken() {
        return localStorage.getItem(TOKEN_KEY) || document.getElementById('admin-token').value.trim();
      }

      function headers() {
        const token = getToken();
        const h = { 'Content-Type': 'application/json' };
        if (token) h.Authorization = 'Bearer ' + token;
        return h;
      }

      function showAlert(message, type = 'success') {
        const el = document.getElementById('alert');
        el.textContent = message;
        el.className = 'show ' + type;
      }

      async function api(path, options = {}) {
        const res = await fetch('/admin' + path, {
          ...options,
          headers: { ...headers(), ...(options.headers || {}) },
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || res.statusText || 'Request failed');
        }
        return res.json();
      }

      function renderOverview(data) {
        document.getElementById('updated-at').textContent =
          'Aggiornato: ' + new Date(data.timestamp).toLocaleString('it-IT');

        const health = document.getElementById('health-badges');
        health.innerHTML = [
          data.health.redis
            ? '<span class="badge ok">Redis OK</span>'
            : '<span class="badge danger">Redis DOWN</span>',
          data.health.database
            ? '<span class="badge ok">Database OK</span>'
            : '<span class="badge danger">Database DOWN</span>',
        ].join(' ');

        document.getElementById('products-count').textContent = data.database.products;
        document.getElementById('redis-waiting').textContent = data.redis.waiting;
        document.getElementById('redis-active').textContent = data.redis.active;

        const drift = document.getElementById('drift-status');
        if (data.drift.likelyStuck) {
          drift.innerHTML =
            '<div class="metric" style="color:var(--danger)">BLOCCATA</div>' +
            '<div class="muted">' +
            data.drift.sqliteQueuedOrRunning +
            ' job queued/running in SQLite, ' +
            data.drift.redisInFlight +
            ' in Redis</div>';
        } else {
          drift.innerHTML =
            '<div class="metric" style="color:var(--ok)">OK</div>' +
            '<div class="muted">SQLite e Redis allineati</div>';
        }

        const stats = document.getElementById('job-stats');
        stats.innerHTML = Object.entries(data.database.jobsByStatus)
          .map(
            ([status, count]) =>
              '<div class="card"><h2>' +
              status +
              '</h2><div class="metric">' +
              count +
              '</div></div>',
          )
          .join('');
      }

      function renderJobs(jobs) {
        const body = document.getElementById('jobs-body');
        body.innerHTML = jobs
          .map((job) => {
            const asin = job.product?.externalId || '—';
            const title = job.product?.title || '—';
            const err = job.error ? job.error.slice(0, 120) : '—';
            return (
              '<tr>' +
              '<td><span class="status ' +
              job.status +
              '">' +
              job.status +
              '</span></td>' +
              '<td>' +
              escapeHtml(title) +
              '</td>' +
              '<td>' +
              escapeHtml(asin) +
              '</td>' +
              '<td>' +
              new Date(job.updatedAt).toLocaleString('it-IT') +
              '</td>' +
              '<td>' +
              escapeHtml(err) +
              '</td>' +
              '</tr>'
            );
          })
          .join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      async function refresh() {
        try {
          const [overview, jobs] = await Promise.all([
            api('/api/overview'),
            api('/api/jobs?limit=30'),
          ]);
          renderOverview(overview);
          renderJobs(jobs);
        } catch (error) {
          showAlert(error.message, 'error');
        }
      }

      document.getElementById('refresh').addEventListener('click', refresh);
      document.getElementById('save-token').addEventListener('click', () => {
        localStorage.setItem(TOKEN_KEY, document.getElementById('admin-token').value.trim());
        showAlert('Token salvato in localStorage');
        refresh();
      });
      document.getElementById('unblock').addEventListener('click', async () => {
        const btn = document.getElementById('unblock');
        btn.disabled = true;
        try {
          const result = await api('/api/queue/unblock', { method: 'POST' });
          showAlert(
            'Sblocco completato: ' +
              result.result.resetCount +
              ' reset, ' +
              result.result.enqueuedCount +
              ' ri-accodati' +
              (result.result.errors.length
                ? '. Errori: ' + result.result.errors.length
                : ''),
            result.ok ? 'success' : 'error',
          );
          renderOverview(result.overview);
          await refresh();
        } catch (error) {
          showAlert(error.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('admin-token').value = localStorage.getItem(TOKEN_KEY) || '';
      refresh();
      setInterval(refresh, 30000);
    </script>
  </body>
</html>
